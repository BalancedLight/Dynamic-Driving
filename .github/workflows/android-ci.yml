name: Android CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  workflow_call:
    inputs:
      run-emulator-tests:
        description: Also run the instrumented Compose and Car App tests on an emulator.
        type: boolean
        default: false
      upload-artifacts:
        description: Upload the unsigned release APKs for a later job to sign.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unit tests, lint, release build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Fails the build if the checked-in wrapper JAR is not one Gradle published, which is the
      # supply-chain hole a wrapper otherwise leaves open.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint (release)
        run: ./gradlew :mobile:lintRelease :automotive:lintRelease --stacktrace

      - name: Assemble release
        run: ./gradlew :mobile:assembleRelease :automotive:assembleRelease --stacktrace

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            **/build/reports/tests/**
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload unsigned release APKs
        if: inputs.upload-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-apks
          path: |
            mobile/build/outputs/apk/release/*.apk
            automotive/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1

  instrumented:
    name: Compose and Car App tests (emulator)
    if: inputs.run-emulator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM is what makes the x86_64 emulator fast enough to be usable in CI.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # The phone module carries the Compose UI tests; the projected module carries the Android
          # Auto browse-template tests. Between them they cover both car entry points.
          script: ./gradlew :mobile:connectedDebugAndroidTest :projected:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-reports
          path: '**/build/reports/androidTests/**'
          if-no-files-found: ignore
          retention-days: 14
